# settings
set-option -g mouse on
set-option -g base-index 1
set-option -g renumber-windows on
set-option -g status-position bottom
set-option -g default-shell ${SHELL}
set -g status-left-length 30

# random session name
set-hook -g after-new-session 'run-shell ~/.config/tmux/words.sh'

set-option -g status-left "[#S]"
#set-option -g status-right  " \"#{=22:pane_title}\" %H:%M %d-%b-%y"
#set-option -g status-right  " #H [ #(tmux list-sessions | wc -l)]"
set-option -g status-right " #H [ #(tmux list-sessions | wc -l)]#{?mouse,,[󰍽 OFF]}"
bind m set-option -g mouse \; refresh-client -S

set-option -g pane-border-status top
set-option -g pane-border-lines heavy

# nvim :checkhealth fixes
set-option -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -as terminal-features ",alacritty*:RGB"

# binds
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

#bind-key M-t display-message "Alt+t works!"

# selection will copy text
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
